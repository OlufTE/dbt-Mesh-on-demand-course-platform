models:
  - name: fct_orders
    config:
      contract:
        enforced: false
    columns:
      - name: ORDER_ID
        data_type: character varying(16777216)
      - name: LOCATION_ID
        data_type: character varying(16777216)
      - name: CUSTOMER_ID
        data_type: character varying(16777216)
      - name: ORDER_TOTAL
        data_type: NUMBER(38,6)
      - name: TAX_PAID
        data_type: NUMBER(38,6)
      - name: ORDERED_AT
        data_type: TIMESTAMP_NTZ
      - name: CUSTOMER_NAME
        data_type: character varying(16777216)
      - name: LOCATION_NAME
        data_type: character varying(16777216)
      - name: TAX_RATE
        data_type: NUMBER(38,0)
      - name: LOCATION_OPENED_AT
        data_type: TIMESTAMP_NTZ
      - name: ORDERED_MONTH
        data_type: NUMBER(2,0)
      - name: ORDERED_DAY
        data_type: NUMBER(2,0)
      - name: ORDERED_YEAR
        data_type: NUMBER(4,0)
